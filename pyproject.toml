[project]
name = "context-lab"
version = "0.1.0"
description = "Learn context engineering and memory by auditing everything a local LLM is told before it is asked a question, and giving every memory a source, an author and a date. Case File 06 of The Lantern Files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# JupyterLab, for the notebook version of each lesson (make notebook N=05).
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]
# Plain cloud clients. Synthetic case material only, and only with synthetic.cloud on.
cloud = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]
# Extras for the formats chapter (05) and the memory libraries chapter (21) are added by those
# chapters, as docs/decisions/ records. Every other chapter needs none of them.

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern"]

[tool.ruff]
line-length = 100
# Generated from run.py by scripts/build_notebooks.py; run.py is what gets linted.
extend-exclude = ["lessons/*/lesson.ipynb"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "lessons"]
markers = ["live: needs a running Ollama with the configured models"]
addopts = "-m 'not live' --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
# Exercise stubs are unfinished on purpose: imports and names the learner will use are unused.
"lessons/*/practice/exercise.py" = ["F401", "F841", "B007", "ARG001"]
